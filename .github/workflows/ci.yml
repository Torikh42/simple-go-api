name: Go CI/CD & Gateway Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [ main, "feat/*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # JOB 1: Test & Lint Kode Go (Backend)
  # ================================================================
  test-and-lint:
    name: Backend Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "File berikut belum diformat:"
            echo "$UNFORMATTED"
            echo "Jalankan 'gofmt -w .' terlebih dahulu!"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binary (Sanity Check)
        run: go build -o bin/api cmd/api/main.go

  # ================================================================
  # JOB 2: Validasi Konfigurasi Gateway Nginx & Docker Compose
  # ================================================================
  infra-validation:
    name: Nginx & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate Nginx Configuration Syntax
        run: |
          docker run --rm \
            --add-host app:127.0.0.1 \
            -v "${{ github.workspace }}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine nginx -t

      - name: Validate Base docker-compose.yml
        run: docker compose config --quiet

      - name: Validate Debug Override docker-compose.db-debug.yml
        run: docker compose -f docker-compose.yml -f docker-compose.db-debug.yml config --quiet

  # ================================================================
  # JOB 3: Build Docker Image dengan Cache Layer
  # ================================================================
  docker-build:
    name: Build Docker Image (GHA Cache)
    runs-on: ubuntu-latest
    needs: [test-and-lint, infra-validation]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: simple-go-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # JOB 4: Smoke Test Multi-Container Stack (End-to-End)
  # ================================================================
  stack-smoke-test:
    name: Stack Smoke Test (E2E Integration)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Start Full Stack (Nginx + 3 Replicas + Postgres)
        run: |
          cp .env.example .env
          docker compose up --build -d
          echo "Waiting for services to become healthy..."
          sleep 10
          docker compose ps

      - name: Probe Gateway Root & Health
        run: |
          curl --retry 10 --retry-delay 2 --retry-connrefused -fail -i http://localhost:8080/health
          curl --retry 10 --retry-delay 2 --retry-connrefused -fail -i http://localhost:8080/api/health
          curl --retry 10 --retry-delay 2 --retry-connrefused -fail -i http://localhost:8080/

      - name: Verify Single Entry Point Isolation
        run: |
          # Port 5434 & 8081 must NOT be reachable from host
          if curl -m 2 http://localhost:5434; then
            echo "Security violation: Database port leaked to host!"
            exit 1
          else
            echo "Postgres port isolation verified."
          fi

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
