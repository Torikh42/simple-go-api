# ---------- Upstream: 3 replika Go API ----------
# zone  : shared memory agar semua worker nginx berbagi state upstream
# resolve: DNS Docker dicek ulang tiap 5 dtk, jadi replika baru/restart tetap terdeteksi
resolver 127.0.0.11 valid=5s ipv6=off;

upstream go_backend {
    zone go_backend 64k;
    server app:8080 max_fails=0;
    server app:8080 max_fails=0;
}

# ---------- Rate limit: 2 request/detik per IP ----------
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;
limit_req_status 429;

# ---------- Cache (bonus) ----------
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=50m inactive=60s use_temp_path=off;

# ---------- Gzip ----------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1;
gzip_types application/json text/plain;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # ---------- Security headers (diadopsi dari IBID) ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Bukti load balancing: IP:port replika yang melayani request
    add_header X-Upstream $upstream_addr always;

    # ---------- Header standar reverse proxy ----------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Resiliency: timeout cepat & failover otomatis jika ada replika down
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;

    # ---------- Dual Route Support (gaya APIM IBID & Slide 57) ----------
    # Request dengan prefix /api/<path> otomatis dipotong menjadi /<path>
    location ~ ^/api/(.*)$ {
        rewrite ^/api/(.*)$ /$1 last;
    }

    # Login: dibatasi laju request
    location = /login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://go_backend;
    }

    # Daftar produk: di-cache 10 detik (bonus), key per-token
    location = /products {
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";
        proxy_cache_valid 200 10s;
        add_header X-Cache-Status $upstream_cache_status always;
        # add_header di level location menimpa level server, jadi ulangi:
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Upstream $upstream_addr always;
        proxy_pass http://go_backend;
    }

    location / {
        proxy_pass http://go_backend;
    }
}
